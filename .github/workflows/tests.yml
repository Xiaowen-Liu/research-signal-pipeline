name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/pipeline-wheel
          /tmp/pipeline-wheel/bin/pip install dist/*.whl
      - name: Verify installed package outside checkout
        working-directory: /tmp
        run: |
          /tmp/pipeline-wheel/bin/python -c "from pathlib import Path; from research_signal_pipeline.database import initialize_database; initialize_database(Path('wheel-smoke.duckdb'))"
          /tmp/pipeline-wheel/bin/python -m research_signal_pipeline.run --help
          /tmp/pipeline-wheel/bin/python -m research_signal_pipeline.report --help
