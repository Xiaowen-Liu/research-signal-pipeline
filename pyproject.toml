[project]
name = "research-signal-pipeline"
version = "0.1.0"
description = "A small, reproducible pipeline for public product-feedback signals."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
